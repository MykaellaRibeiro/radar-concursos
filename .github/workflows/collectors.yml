name: Scheduled collectors

on:
  workflow_dispatch:
    inputs:
      collector:
        description: Collector to run
        type: choice
        required: true
        default: pci
        options: [pci, predicted, documents, documents-full]
      document_batch_size:
        description: Number of contests in the document batch (maximum 50)
        type: string
        required: false
        default: "5"
      document_offset:
        description: Zero-based catalog offset for the document batch
        type: string
        required: false
        default: "0"
  schedule:
    - cron: "17 5,13,21 * * *"
    - cron: "37 9 * * *"
    - cron: "47 11 * * 0"

permissions:
  contents: read

jobs:
  pci:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 5,13,21 * * *') || (github.event_name == 'workflow_dispatch' && inputs.collector == 'pci')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: radar-pci-collector
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run collect:pci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PCI_MCP_URL: ${{ vars.PCI_MCP_URL }}
          ENABLE_PCI_COLLECTOR: ${{ vars.ENABLE_PCI_COLLECTOR }}
          PCI_SANITY_MAX_ITEMS: ${{ vars.PCI_SANITY_MAX_ITEMS }}
          PCI_SUPPLEMENTAL_QUERY_LIMIT: ${{ vars.PCI_SUPPLEMENTAL_QUERY_LIMIT }}

  predicted:
    if: (github.event_name == 'schedule' && github.event.schedule == '37 9 * * *') || (github.event_name == 'workflow_dispatch' && inputs.collector == 'predicted')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: radar-web-discovery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run collect:predicted
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXA_MCP_URL: ${{ vars.EXA_MCP_URL }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ENABLE_WEB_DISCOVERY: ${{ vars.ENABLE_WEB_DISCOVERY }}

  documents:
    if: (github.event_name == 'schedule' && github.event.schedule == '47 11 * * 0') || (github.event_name == 'workflow_dispatch' && (inputs.collector == 'documents' || inputs.collector == 'documents-full'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: radar-document-collector
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - if: github.event_name == 'schedule' || inputs.collector == 'documents'
        run: npm run collect:documents -- --max-concursos="$DOCUMENT_BATCH_SIZE" --contest-offset="$DOCUMENT_OFFSET" --max-files-per-contest=5 --concurrency=1
        env:
          DOCUMENT_BATCH_SIZE: ${{ github.event_name == 'schedule' && '10' || inputs.document_batch_size || '5' }}
          DOCUMENT_OFFSET: ${{ inputs.document_offset || '0' }}
          ROTATE_DOCUMENT_CATALOG: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENABLE_DOCUMENT_COLLECTOR: ${{ vars.ENABLE_DOCUMENT_COLLECTOR }}
          ENABLE_DOCUMENT_DISCOVERY: ${{ vars.ENABLE_DOCUMENT_DISCOVERY }}
          DOCUMENT_SEARCH_PROVIDER: ${{ vars.DOCUMENT_SEARCH_PROVIDER }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          EXA_MCP_URL: ${{ vars.EXA_MCP_URL }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      - if: github.event_name == 'workflow_dispatch' && inputs.collector == 'documents-full'
        run: npm run backfill:documents -- --batch-size=50 --start-offset="$DOCUMENT_OFFSET"
        env:
          DOCUMENT_OFFSET: ${{ inputs.document_offset || '0' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENABLE_DOCUMENT_COLLECTOR: ${{ vars.ENABLE_DOCUMENT_COLLECTOR }}
          ENABLE_DOCUMENT_DISCOVERY: ${{ vars.ENABLE_DOCUMENT_DISCOVERY }}
          DOCUMENT_SEARCH_PROVIDER: ${{ vars.DOCUMENT_SEARCH_PROVIDER }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          EXA_MCP_URL: ${{ vars.EXA_MCP_URL }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
